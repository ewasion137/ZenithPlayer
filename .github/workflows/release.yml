name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запускается, когда ты пушишь тег версии (v2.2.0, v2.2.1 и т.д.)
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой в интерфейсе GitHub

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # На Linux собираем AppImage, deb и tar.gz
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # На Windows собираем nsis (.exe)
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Публикуем готовые бинарники в Releases
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}