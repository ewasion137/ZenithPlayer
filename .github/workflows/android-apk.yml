name: Build Zenith Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Zenith/**"
      - "android/**"
      - "prepare-android.js"
      - "capacitor.config.json"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Maven Central Mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.gradle
          allprojects {
              buildscript {
                  repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) {
                              repo.url = uri('https://maven-central.storage-download.googleapis.com/maven2')
                          }
                      }
                  }
              }
              repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) {
                          repo.url = uri('https://maven-central.storage-download.googleapis.com/maven2')
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Prepare web bundle and sync Capacitor
        run: |
          node prepare-android.js
          npx cap sync android

      - name: Build Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zenith-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk