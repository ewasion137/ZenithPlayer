<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Zenith</title>
    <link rel="stylesheet" href="styles/main.css">
    <link id="theme-link" rel="stylesheet" href="">
</head>

<body>
    <!-- 1. TITLE BAR -->
    <div class="title-bar">
        <div class="title-bar-drag">
            <img src="icon.png" class="title-icon">
            <span class="title-text">ZENITH PLAYER</span>
        </div>
        <div class="window-controls">
            <button id="win-min" class="win-btn">&minus;</button>
            <button id="win-max" class="win-btn">&#9634;</button>
            <button id="win-close" class="win-btn win-close">&times;</button>
        </div>
    </div>

    <!-- 2. MAIN WORKSPACE (VS CODE STYLE SPLIT) -->
    <div class="app-workspace">
        <canvas id="spectrogram-canvas"></canvas>

        <!-- LEFT: MAIN PLAYER STAGE -->
        <div class="player-stage">
            <!-- NOW PLAYING -->
            <div class="now-playing-container">
                <div class="artwork-glow"></div>
                <div class="track-info">
                    <h1 id="current-track-name">Zenith Player</h1>
                    <p id="current-track-folder">Select a folder or track</p>
                </div>
            </div>

            <!-- CONTROLS & WAVEFORM -->
            <div id="top-controls">
                <div class="main-controls">
                    <button id="prev-btn" title="Previous Track"></button>
                    <button id="play-pause-btn" title="Play/Pause (Space)"></button>
                    <button id="next-btn" title="Next Track"></button>
                </div>

                <div class="controls-column">
                    <div class="sliders-row">
                        <div class="control-group">
                            <label>Vol</label>
                            <input type="range" id="track-volume-slider" min="0" max="200" value="100" step="1">
                            <input type="number" id="track-volume-input" min="0" max="200" value="100" class="control-input">
                            <span id="track-volume-value">100%</span>
                        </div>
                        <div class="control-group">
                            <label>Speed</label>
                            <input type="range" id="speed-slider" min="50" max="200" value="100" step="1">
                            <input type="number" id="speed-input" min="50" max="200" value="100" class="control-input">
                            <span id="speed-value">100%</span>
                        </div>
                    </div>

                    <div id="progress-view">
                        <div class="waveform-container">
                            <canvas id="waveform-canvas"></canvas>
                            <input type="range" id="progress-slider" min="0" max="1000" value="0">
                        </div>
                        <div id="time-display">
                            <span>00:00</span>
                            <span>00:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EQUALIZER -->
            <div class="eq-container-wrapper">
                <div class="eq-header-label">EQUALIZER</div>
                <div class="eq-bands"></div>
            </div>
        </div>

        <!-- RESIZER DIVIDER -->
        <div id="sidebar-resizer" class="resizer-bar" title="Drag to resize explorer"></div>

        <!-- RIGHT: EXPLORER SIDEBAR -->
        <div class="explorer-sidebar" id="explorer-sidebar">
            <div class="explorer-header">
                <span>EXPLORER</span>
                <button id="select-folder-btn" title="Open Folder">📂 Open</button>
            </div>
            <div class="track-list-container">
                <div id="track-list"></div>
            </div>
        </div>
    </div>

    <!-- 3. BOTTOM STATUS BAR (VS CODE STYLE) -->
    <div class="status-bar">
        <div class="status-left">
            <button id="discord-rpc-btn" class="status-btn" title="Discord Rich Presence">🎮 <span id="rpc-quick-status">RPC</span></button>
            <button id="optimize-btn" class="status-btn" title="Toggle Visuals">GFX: ON</button>
            <button id="save-settings-btn" class="status-btn" title="Save Settings">💾 Save</button>
            <button id="reset-settings-btn" class="status-btn" title="Reset Settings">Reset</button>
        </div>

        <div class="status-center">
            <div class="status-search">
                <input type="text" id="search-input" placeholder="🔍 Search tracks...">
            </div>
        </div>

        <div class="status-right">
            <span id="audio-format-tag" class="status-tag">44.1kHz • DSP</span>
            <button id="theme-switcher" class="status-btn" title="Change Theme">🎨 Theme</button>
        </div>
    </div>

    <!-- 4. DISCORD RPC MODAL -->
    <div id="rpc-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Discord Rich Presence</h3>
                <button id="close-rpc-modal">&times;</button>
            </div>
            <div class="modal-body">
                <label for="rpc-client-id">Application Client ID:</label>
                <input type="text" id="rpc-client-id" placeholder="Paste Discord Client ID...">
                <div class="rpc-status-container">
                    <span>Status: </span>
                    <span id="rpc-status-text" class="status-disconnected">Disconnected</span>
                </div>
                <div class="modal-actions">
                    <button id="rpc-connect-btn">Connect</button>
                    <button id="rpc-disconnect-btn">Disconnect</button>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
